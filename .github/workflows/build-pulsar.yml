
name: Build PULSAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-37.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Extract PULSAR source
        run: |
          unzip -q PULSAR-consistent-navigation-resource-fix-sdk37.zip -d buildsrc
          test -f buildsrc/PULSAR/gradlew

      - name: Initialise Git metadata
        working-directory: buildsrc/PULSAR
        run: |
          git init
          git config user.name "PULSAR Build"
          git config user.email "build@users.noreply.github.com"
          git add -A
          git commit -m "Prepare PULSAR source"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: buildsrc/PULSAR
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleStableDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PULSAR-APK
          path: buildsrc/PULSAR/app/build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error
          retention-days: 14
